<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Safety Squad: Mission Planet</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Bangers&display=swap" rel="stylesheet">
<style>
:root{--ink:#140a45;--yel:#ffd23a;--pink:#ff4fa3;--cy:#7be7ff;--red:#e63946;--grn:#2ecc71;--pur:#7a2fd6;--f:'Baloo 2','Trebuchet MS','Arial Rounded MT Bold',system-ui,sans-serif;--c:'Bangers','Baloo 2','Impact',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0d0a3c;font-family:var(--f);color:#fff}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.cf{font-family:var(--c);letter-spacing:1.5px;font-weight:400}
/* ===== cosmic backdrop ===== */
#space{position:fixed;inset:0;z-index:15;display:none;overflow:hidden;pointer-events:none;background:radial-gradient(ellipse at 50% 30%,#8a3bff 0%,#4a1fb5 38%,#1d0e6b 70%,#0e0742 100%)}
#space.on{display:block}
#space .rays{position:absolute;left:-60%;top:-40%;width:220%;height:180%;background:repeating-conic-gradient(from 0deg at 50% 36%,rgba(255,255,255,.10) 0 7deg,transparent 7deg 15deg);animation:spin 120s linear infinite}
#space .dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.2) 1.5px,transparent 2px);background-size:13px 13px;-webkit-mask-image:linear-gradient(to bottom,transparent 25%,#000 95%);mask-image:linear-gradient(to bottom,transparent 25%,#000 95%)}
#space .st{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:twk 2.6s infinite}
#space .pl{position:absolute;animation:flt 6s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes twk{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.5)}}
@keyframes flt{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-12px) rotate(4deg)}}
/* ===== screens ===== */
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:flex-start;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));z-index:20;overflow:auto}
.screen.on{display:flex}
#lk{-webkit-user-select:text;user-select:text;touch-action:auto;width:100%;font:800 18px Inter,system-ui,sans-serif;padding:12px;border:4px solid var(--ink);border-radius:12px;text-align:center;color:var(--ink);background:#fff;margin:8px 0 2px}
#wm{position:fixed;left:50%;bottom:max(3px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:9999;pointer-events:none;font:800 11px Inter,system-ui,sans-serif;letter-spacing:.4px;color:#fff;opacity:.42;text-shadow:0 1px 0 #140a45,0 0 3px #140a45;white-space:nowrap}
.screen>*{position:relative;z-index:2;flex:none}
.screen>:first-child{margin-top:auto}.screen>:last-child{margin-bottom:auto}
.screen,.screen *{touch-action:pan-y}
.dim{background:radial-gradient(ellipse at 50% 40%,rgba(60,25,150,.55),rgba(8,4,35,.9))}
.cosm{background:transparent}
/* ===== titles & text ===== */
.ttl{font-family:var(--c);font-weight:400;letter-spacing:2px;color:var(--yel);-webkit-text-stroke:7px var(--ink);paint-order:stroke fill;text-shadow:3px 5px 0 var(--ink);line-height:.95;text-align:center;margin:0}
.ttl.w{color:#fff}.ttl.pk{color:var(--pink)}
h2{font-family:var(--c);font-weight:400;letter-spacing:2px;margin:0 0 6px;font-size:min(10vw,46px);line-height:1;color:var(--yel);-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;text-shadow:2px 4px 0 var(--ink);text-align:center;transform:rotate(-1.5deg)}
p{margin:6px 0;line-height:1.3}
.small{font-size:13px;opacity:.92;font-weight:600}
.cap{display:inline-block;background:var(--yel);color:var(--ink);border:3px solid var(--ink);padding:2px 12px;font-family:var(--c);letter-spacing:1.5px;font-size:20px;box-shadow:3px 3px 0 var(--ink);transform:rotate(-2deg)}
.cap.pk{background:var(--pink);color:#fff}.cap.cy{background:var(--cy)}.cap.wh{background:#fff}
.sticker{display:inline-flex;align-items:center;justify-content:center;text-align:center;font-family:var(--c);letter-spacing:1px;color:var(--ink);background:var(--yel);line-height:.9;clip-path:polygon(50.0% 0.0%,57.8% 10.8%,69.1% 3.8%,72.2% 16.7%,85.4% 14.6%,83.3% 27.8%,96.2% 30.9%,89.2% 42.2%,100.0% 50.0%,89.2% 57.8%,96.2% 69.1%,83.3% 72.2%,85.4% 85.4%,72.2% 83.3%,69.1% 96.2%,57.8% 89.2%,50.0% 100.0%,42.2% 89.2%,30.9% 96.2%,27.8% 83.3%,14.6% 85.4%,16.7% 72.2%,3.8% 69.1%,10.8% 57.8%,0.0% 50.0%,10.8% 42.2%,3.8% 30.9%,16.7% 27.8%,14.6% 14.6%,27.8% 16.7%,30.9% 3.8%,42.2% 10.8%);padding:22px;filter:none}
/* ===== buttons ===== */
.btn{font-family:var(--c);letter-spacing:1.5px;font-weight:400;font-size:min(8vw,30px);color:var(--ink);background:linear-gradient(#ffe36b,#ffc61a);border:4px solid var(--ink);border-radius:14px;padding:6px 26px 4px;box-shadow:0 6px 0 var(--ink);cursor:pointer;margin:9px 6px 12px;min-width:170px;touch-action:manipulation;transition:transform .08s;transform:rotate(-1.2deg);position:relative;line-height:1.1}
.btn:nth-child(even){transform:rotate(1.2deg)}
.btn:after{content:'';position:absolute;left:10px;right:10px;top:3px;height:6px;border-radius:4px;background:rgba(255,255,255,.55)}
.btn:active{transform:translateY(5px) rotate(0);box-shadow:0 1px 0 var(--ink)}
.btn.pink{background:linear-gradient(#ff7cc0,#ff3d97);color:#fff;-webkit-text-stroke:1px var(--ink);paint-order:stroke fill}
.btn.cy{background:linear-gradient(#a6f0ff,#52d2f0)}.btn.grn{background:linear-gradient(#7cf3a8,#2ecc71)}.btn.red{background:linear-gradient(#ff7a8a,#e63946);color:#fff}
.btn.sm{font-size:20px;min-width:0;padding:5px 18px 3px;margin:6px 4px 10px}
.btn.big{font-size:min(11vw,46px);padding:8px 42px 6px;animation:pulse 1.3s infinite;border-radius:18px;box-shadow:0 8px 0 var(--ink),0 0 0 4px #fff}
@keyframes pulse{50%{transform:scale(1.06) rotate(-1deg)}}
/* ===== comic panel card ===== */
.card{position:relative;background:radial-gradient(rgba(255,255,255,.07) 1.5px,transparent 2px) 0 0/11px 11px,linear-gradient(#34208f,#1f1368);border:4px solid var(--ink);border-radius:10px;box-shadow:0 0 0 4px #fff,0 0 0 8px var(--ink),0 14px 0 8px rgba(0,0,0,.35);padding:18px 16px 14px;max-width:500px;width:calc(100% - 20px);margin:10px 0}
.card.paper{background:radial-gradient(rgba(20,10,69,.08) 1.5px,transparent 2px) 0 0/10px 10px,#fffaf0;color:var(--ink)}
.row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tip{background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:14px 14px 14px 4px;padding:9px 12px;margin:12px 0 8px;font-size:15px;font-weight:600;box-shadow:3px 3px 0 var(--ink);position:relative;line-height:1.25}
.tip b{color:#c4162a}
ul.g{margin:6px 0 4px;padding-left:22px;font-weight:700}ul.g li{margin:3px 0}
/* ===== helmet avatars ===== */
.helm{position:relative;width:var(--s,84px);height:var(--s,84px);border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff 0,#d4f1ff 38%,#7cc4ee 100%);border:4px solid var(--ink);box-shadow:0 0 0 3px #fff,0 5px 0 3px var(--ink);overflow:hidden;flex:none}
.helm img,.helm canvas{width:100%;height:100%;display:block;object-fit:cover}
.helm:after{content:'';position:absolute;left:12%;top:8%;width:46%;height:30%;border-radius:50%;background:linear-gradient(rgba(255,255,255,.75),rgba(255,255,255,0));transform:rotate(-28deg)}
/* ===== title ===== */
#sTitle .wrap{display:flex;flex-direction:column;align-items:center;width:100%}
.kick{font-family:var(--f);font-weight:800;letter-spacing:.22em;font-size:min(3.6vw,15px);color:#fff;text-shadow:0 2px 0 var(--ink);display:flex;align-items:center;gap:8px}
.logo1{font-size:min(15.5vw,74px);white-space:nowrap;transform:rotate(-3deg);margin-top:6px;text-shadow:3px 5px 0 var(--pink),5px 8px 0 var(--ink)}
.logo2{font-size:min(12.5vw,58px);white-space:nowrap;transform:rotate(-2deg) skewX(-4deg);margin-top:2px;text-shadow:3px 5px 0 #2f6fe4,5px 8px 0 var(--ink)}
.ribbon{background:linear-gradient(#ff6a78,#e63946);color:#fff;border:4px solid var(--ink);border-radius:10px;padding:3px 24px 1px;font-family:var(--c);letter-spacing:2px;font-size:min(6.4vw,26px);margin-top:12px;transform:rotate(-1.5deg);box-shadow:0 5px 0 var(--ink);-webkit-text-stroke:1px var(--ink);paint-order:stroke fill}
.hero{position:relative;width:100%;max-width:380px;height:min(36vw,150px);margin:6px 0 0}
.hero .rk{position:absolute;left:50%;top:-4px;width:min(30vw,128px);transform:translateX(-30%) rotate(32deg);animation:flt 3.2s ease-in-out infinite}
.hero .bst{position:absolute;left:2%;top:2px;width:min(30vw,118px);height:min(30vw,118px);display:flex;align-items:center;justify-content:center;text-align:center;transform:rotate(-10deg);animation:wob 2.4s ease-in-out infinite}
.hero .bst:before{content:'';position:absolute;inset:0;background:var(--ink);clip-path:polygon(50.0% 0.0%,57.8% 10.8%,69.1% 3.8%,72.2% 16.7%,85.4% 14.6%,83.3% 27.8%,96.2% 30.9%,89.2% 42.2%,100.0% 50.0%,89.2% 57.8%,96.2% 69.1%,83.3% 72.2%,85.4% 85.4%,72.2% 83.3%,69.1% 96.2%,57.8% 89.2%,50.0% 100.0%,42.2% 89.2%,30.9% 96.2%,27.8% 83.3%,14.6% 85.4%,16.7% 72.2%,3.8% 69.1%,10.8% 57.8%,0.0% 50.0%,10.8% 42.2%,3.8% 30.9%,16.7% 27.8%,14.6% 14.6%,27.8% 16.7%,30.9% 3.8%,42.2% 10.8%)}
.hero .bst:after{content:'';position:absolute;inset:5px;background:radial-gradient(circle at 40% 30%,#ff8a96,#e63946 70%);clip-path:polygon(50.0% 0.0%,57.8% 10.8%,69.1% 3.8%,72.2% 16.7%,85.4% 14.6%,83.3% 27.8%,96.2% 30.9%,89.2% 42.2%,100.0% 50.0%,89.2% 57.8%,96.2% 69.1%,83.3% 72.2%,85.4% 85.4%,72.2% 83.3%,69.1% 96.2%,57.8% 89.2%,50.0% 100.0%,42.2% 89.2%,30.9% 96.2%,27.8% 83.3%,14.6% 85.4%,16.7% 72.2%,3.8% 69.1%,10.8% 57.8%,0.0% 50.0%,10.8% 42.2%,3.8% 30.9%,16.7% 27.8%,14.6% 14.6%,27.8% 16.7%,30.9% 3.8%,42.2% 10.8%)}
.hero .bst span{position:relative;z-index:2;font-family:var(--c);font-size:min(6.2vw,25px);line-height:.95;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;letter-spacing:1px}
.hero .bst span b{display:block;font-size:1.7em;color:var(--yel)}
.hero .snd{position:absolute;font-family:var(--c);font-size:min(6vw,24px);letter-spacing:1px;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:2px 3px 0 var(--ink)}
@keyframes wob{0%,100%{transform:rotate(-10deg) scale(1)}50%{transform:rotate(-6deg) scale(1.07)}}
.crew{display:flex;gap:min(2.6vw,12px);align-items:flex-end;margin-top:8px;position:relative}
.crew .helm{--s:min(17vw,72px)}
.crew .helm:nth-child(even){transform:translateY(-8px)}
.bubble{position:relative;background:#fff;color:var(--ink);border:4px solid var(--ink);border-radius:20px;padding:4px 14px 2px;font-family:var(--c);letter-spacing:1px;font-size:min(5.6vw,22px);box-shadow:3px 3px 0 var(--ink);display:inline-block;transform:rotate(2deg)}
.bubble:after{content:'';position:absolute;left:26px;bottom:-15px;border:8px solid transparent;border-top:12px solid var(--ink);border-bottom:0}
.bubble:before{content:'';position:absolute;left:29px;bottom:-9px;border:5px solid transparent;border-top:8px solid #fff;border-bottom:0;z-index:2}
/* ===== character select ===== */
.chars{display:grid;grid-template-columns:1fr 1fr;gap:18px 14px;max-width:460px;width:100%;margin-top:6px}
.ch{position:relative;background:radial-gradient(rgba(20,10,69,.1) 1.6px,transparent 2px) 0 0/10px 10px,linear-gradient(160deg,#fff,#ffeec2);color:var(--ink);border:4px solid var(--ink);border-radius:8px;padding:34px 8px 10px;text-align:center;cursor:pointer;box-shadow:0 0 0 3px #fff,0 8px 0 3px var(--ink);touch-action:manipulation;transform:rotate(-1.6deg)}
.ch:nth-child(even){transform:rotate(1.6deg)}
.ch:active{transform:translateY(5px) scale(.98)}
.ch .helm{--s:min(25vw,96px);margin:-62px auto 4px;border-color:var(--c)}
.ch b{display:block;font-family:var(--c);font-weight:400;letter-spacing:1.5px;font-size:28px;line-height:1;color:var(--c);-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:2px 3px 0 var(--ink)}
.ch span{display:block;font-size:13px;font-weight:700;line-height:1.1;margin-top:3px}
.ch i{position:absolute;right:-8px;top:-12px;font-style:normal;font-family:var(--c);background:var(--pink);color:#fff;border:3px solid var(--ink);padding:0 8px;font-size:16px;transform:rotate(10deg);box-shadow:2px 2px 0 var(--ink)}
/* ===== mission map ===== */
.map{position:relative;width:100%;max-width:420px;margin:8px auto 4px}
.map svg.pth{position:absolute;left:0;top:0;pointer-events:none}
.node{position:absolute;width:112px;margin-left:-56px;text-align:center;cursor:pointer;touch-action:manipulation}
.node .pn{position:relative;width:86px;height:86px;margin:0 auto;border-radius:50%;border:4px solid var(--ink);box-shadow:0 0 0 3px #fff,0 6px 0 3px var(--ink);display:flex;align-items:center;justify-content:center;font-size:38px;background:radial-gradient(circle at 30% 26%,rgba(255,255,255,.8),rgba(255,255,255,0) 32%),linear-gradient(135deg,var(--a),var(--b))}
.node .pn:before{content:'';position:absolute;left:-18px;right:-18px;top:50%;height:26px;margin-top:-4px;border:4px solid var(--ink);border-radius:50%;transform:rotate(-18deg);background:transparent;box-shadow:inset 0 0 0 3px rgba(255,235,120,.85);clip-path:polygon(0 56%,100% 56%,100% 100%,0 100%);z-index:3}
.node.o2 .pn:before{transform:rotate(16deg)}
.node .no{position:absolute;left:-12px;top:-10px;width:34px;height:34px;border-radius:50%;background:var(--yel);color:var(--ink);border:3px solid var(--ink);font-family:var(--c);font-size:21px;line-height:30px;box-shadow:2px 2px 0 var(--ink);z-index:4}
.node .nm{display:inline-block;margin-top:10px;background:#fff;color:var(--ink);border:3px solid var(--ink);padding:0 8px;font-family:var(--c);letter-spacing:1px;font-size:17px;line-height:1.15;box-shadow:3px 3px 0 var(--ink);transform:rotate(-2deg);max-width:150px;margin-left:-20px;margin-right:-20px}
.node .ss{display:block;font-size:17px;letter-spacing:2px;margin-top:3px;filter:drop-shadow(0 2px 0 var(--ink))}
.node.cur .pn{animation:pulse 1.2s infinite}
.node.cur:before{content:'PLAY!';position:absolute;left:50%;top:-30px;transform:translateX(-50%) rotate(-4deg);background:var(--pink);color:#fff;font-family:var(--c);font-size:19px;border:3px solid var(--ink);padding:0 10px;box-shadow:2px 2px 0 var(--ink);z-index:5;white-space:nowrap}
.node.lock{cursor:not-allowed}.node.lock .pn{filter:grayscale(1) brightness(.62)}.node.lock .pn:after{content:'🔒';position:absolute;font-size:30px}
.node.lock .nm{opacity:.75}
/* ===== intro ===== */
.intro{padding-top:30px}
.intro>.cap:first-child{position:absolute;left:-6px;top:-18px;font-size:24px}
.intro .big-e{font-size:76px;filter:drop-shadow(0 6px 0 rgba(20,10,69,.5));text-align:center;line-height:1.05;animation:flt 3.4s ease-in-out infinite}
.intro .ttl{font-size:min(11vw,50px);margin:4px 0 2px}
.ctrls{display:flex;gap:8px;margin:10px 0 2px}
.ctrls div{flex:1;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:8px;padding:6px 4px;text-align:center;font-weight:800;font-size:12px;line-height:1.1;box-shadow:3px 3px 0 var(--ink)}
.ctrls div b{display:block;font-family:var(--c);font-weight:400;font-size:24px;letter-spacing:1px;line-height:1.1}
/* ===== HUD ===== */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10;display:none}
#hud.on{display:block}
#hud .top{position:absolute;left:0;right:0;top:max(12px,env(safe-area-inset-top));display:flex;align-items:flex-start;gap:8px;padding:0 14px}
.rb{pointer-events:auto;width:46px;height:46px;border-radius:12px;border:4px solid var(--ink);background:linear-gradient(#ffe36b,#ffc61a);color:var(--ink);font-size:20px;font-weight:800;box-shadow:0 4px 0 var(--ink);display:flex;align-items:center;justify-content:center;touch-action:manipulation;font-family:var(--f);transform:rotate(-3deg);flex:none}
.rb:active{transform:translateY(3px)}
#lvname{flex:1;text-align:center;min-width:0}
.banner{display:inline-block;background:var(--yel);color:var(--ink);border:4px solid var(--ink);padding:0 12px 1px;box-shadow:3px 3px 0 var(--ink);transform:rotate(-1.5deg);max-width:100%;overflow:hidden}
.banner small{display:block;font-family:var(--c);letter-spacing:2px;font-size:12px;line-height:1;color:#c4162a;margin-top:2px}
.banner b{display:block;font-family:var(--c);font-weight:400;letter-spacing:1.5px;font-size:18px;line-height:1.05;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.hbox{pointer-events:auto;background:#fff;border:4px solid var(--ink);border-radius:12px;padding:2px 8px 0;box-shadow:3px 3px 0 var(--ink);transform:rotate(2deg);flex:none}
#hearts{font-size:17px;letter-spacing:0;filter:drop-shadow(0 1px 0 rgba(0,0,0,.5))}
#goals{position:absolute;left:12px;top:calc(max(12px,env(safe-area-inset-top)) + 62px);display:flex;flex-direction:row;flex-wrap:wrap;gap:5px;align-items:flex-start;right:12px}
.chip{background:#fff7c2;color:var(--ink);border:2.5px solid var(--ink);padding:0 7px;font-weight:800;font-size:12.5px;box-shadow:2px 2px 0 var(--ink);display:inline-flex;gap:5px;align-items:center;white-space:nowrap;transform:rotate(-1.4deg)}
#goals .chip:nth-child(even){transform:rotate(1.2deg);background:#d9f6ff}
#goals .done{background:#9af0b8!important;text-decoration:none}
#goals .done:after{content:' ✔';color:#0b6a32;font-weight:800}
#joy{position:absolute;left:0;top:30%;bottom:0;width:58%;pointer-events:auto;touch-action:none}
#joyb{position:absolute;width:124px;height:124px;border-radius:50%;background:rgba(255,255,255,.16);border:4px dashed rgba(255,255,255,.7);display:none;transform:translate(-50%,-50%)}
#joyk{position:absolute;left:50%;top:50%;width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ffe36b);border:4px solid var(--ink);transform:translate(-50%,-50%);box-shadow:0 4px 0 var(--ink)}
.abtns{position:absolute;right:12px;bottom:max(24px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.ab{pointer-events:auto;border:0;background:transparent;font-family:var(--c);color:#fff;touch-action:manipulation;display:flex;align-items:center;justify-content:center;flex-direction:column;line-height:1;position:relative;padding:0}
.ab:active{transform:translateY(4px) scale(.97)}
#bShout{width:128px;height:128px;background:var(--ink);clip-path:polygon(50.0% 0.0%,57.8% 10.8%,69.1% 3.8%,72.2% 16.7%,85.4% 14.6%,83.3% 27.8%,96.2% 30.9%,89.2% 42.2%,100.0% 50.0%,89.2% 57.8%,96.2% 69.1%,83.3% 72.2%,85.4% 85.4%,72.2% 83.3%,69.1% 96.2%,57.8% 89.2%,50.0% 100.0%,42.2% 89.2%,30.9% 96.2%,27.8% 83.3%,14.6% 85.4%,16.7% 72.2%,3.8% 69.1%,10.8% 57.8%,0.0% 50.0%,10.8% 42.2%,3.8% 30.9%,16.7% 27.8%,14.6% 14.6%,27.8% 16.7%,30.9% 3.8%,42.2% 10.8%);overflow:hidden}
